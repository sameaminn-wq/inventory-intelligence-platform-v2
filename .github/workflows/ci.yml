name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'bootstrap/**', 'phase-1/**']

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build API and web
        run: npm run build
